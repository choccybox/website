<!-- basic website structure -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Basic Website Structure</title>
    <link rel="stylesheet" href="fonts/stylesheet.css">
    <link rel="stylesheet" href="styles/reactive.css">
    <link rel="stylesheet" href="styles/page.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div id="main">
        <div id="main_content">
            <div id="main_top">
                <img id="avatar" class="panel" src="styles/blank.png"></img>

                    <div id="text" class="panel">
                        <div id="text_inner">
                            <h1>choccy</h1>
                            <p id="quotes"></p>
                            <p>
                                hobbyist, music addict</p>
                                <p id="age"></p>
                                <p id="pronouns"></p>
                                <p id="flag"></p>
                        </div>    
                    </div>

                    <div id="player" class="panel">
                        <a id="player_link" target="_blank">
                            <img id="player_image" src="./styles/blank.png"></img>
                        </a>
                        <p id="player_title"></p>
                    </div>

            </div>

            <div id="main_bottom">
                <div id="socials">
                    <a><div class="social_button"><div class="icon"></div></div></a>
                    <a><div class="social_button"><div class="icon"></div></div></a>
                    <a><div class="social_button"><div class="icon"></div></div></a>
                    <a><div class="social_button"><div class="icon"></div></div></a>
                    <a><div class="social_button"><div class="icon"></div></div></a>
                    <a><div class="social_button"><div class="icon"></div></div></a>
                </div>
            </div>
</div>
</div>

<script src="scripts/player.js"></script>
<script src="scripts/bday.js"></script>
<script src="scripts/pronounspage.js"></script>
<script src="scripts/socials.js"></script>
<script src="scripts/avatars.js"></script>
</body>
</html>
