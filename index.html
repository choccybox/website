<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>choccy</title>
    <link rel="icon" href="styles/icon.png">
    <link rel="stylesheet" href="fonts/stylesheet.css">
    <link rel="stylesheet" href="styles/reactive.css">
    <link rel="stylesheet" href="styles/page.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">

<style>
    ::-webkit-scrollbar {
        width: 0px;
    }

    .noselect {
        -webkit-touch-callout: none; /* iOS Safari */
        -webkit-user-select: none; /* Safari */
        -khtml-user-select: none; /* Konqueror HTML */
        -moz-user-select: none; /* Old versions of Firefox */
        -ms-user-select: none; /* Internet Explorer/Edge */
        user-select: none; /* Non-prefixed version, currently supported by Chrome, Edge, Opera and Firefox */

        -webkit-user-drag: none;
        -khtml-user-drag: none;
        -moz-user-drag: none;
        -o-user-drag: none;
    }
</style>
</head>
<body>
        <div id="main_content" class="noselect">
            <div id="main_top">
                    <div class="panel_loader"></div>
                    <div class="panel_loader"></div>
                    <div class="panel_loader"></div>

                    <div id="avatar">
                        <a id="avatar_link" target="_blank" class="noselect">
                            <img id="avatar_image" class="panel noselect" src="styles/blank.png"></img>
                            <div id="avatar_credit">
                                <p id="avatar_credit_text"></p>
                            </div>
                        </a>
                    </div>

                    <div id="text" class="panel noselect">
                        <div id="text_outer">
                            <div id="text_inner">
                                <h1>choccy</h1>
                                <p>
                                    hobbyist<br>
                                    programmer<br>
                                    music addict<br></p>
                                    <p id="age"></p>
                                    <p id="pronouns"></p>
                                    <p id="flag"></p>
                            </div>   
                        </div> 
                    </div>

                    <div id="player" class="panel">
                        <a id="player_link" target="_blank" class="noselect">
                            <img id="player_image" class="noselect" src="./styles/blank.png"></img>
                        </a>
                       
                        <div id="player_timeline">
                            <div id="player_progress"></div>
                            <p id="player_title" class="noselect"></p>

                        </div>
                    </div>
                                        
            </div>

            <div id="main_bottom">
                <div id="socials">
                    <a><div class="social_button"><div class="icon"></div></div></a>
                    <a><div class="social_button"><div class="icon"></div></div></a>
                    <a><div class="social_button"><div class="icon"></div></div></a>
                    <a><div class="social_button"><div class="icon"></div></div></a>
                    <a><div class="social_button"><div class="icon"></div></div></a>
                    <a><div class="social_button"><div class="icon"></div></div></a>
                </div>
            </div>
</div>

<script>
    // start all scripts from ./scripts
    var scripts = [
        "scripts/bday.js",
        "scripts/userinfo.js",
        "scripts/pronounspage.js",
        "scripts/player.js",
    ];

    var scripts_loaded = 0;
    var scripts_total = scripts.length;

    function script_loaded() {
        scripts_loaded++;
        if (scripts_loaded === scripts_total) {
            console.log("All scripts loaded");
            // All scripts are loaded, now wait for asynchronous operations to complete
            waitForAsyncOperations();
        }
    }

    function waitForAsyncOperations() {
        // Check if your asynchronous operations have completed
        if (typeof fetchAndDisplayUserInfo === 'function' && typeof fetchAndDisplayTime === 'function') {
            // If fetch operations are complete, show panels
            console.log("All asynchronous operations completed");
            showPanels();
        } else {
            // If not complete, wait and check again after a delay
            setTimeout(waitForAsyncOperations, 100);
        }
    }

    function showPanels() {
        // Set the CSS properties for all elements with the 'panel' class
        var panels = document.getElementsByClassName('panel');
        for (var i = 0; i < panels.length; i++) {
            panels[i].style.display = 'block';
        }
        // Set the CSS properties for all elements with the 'panel_loader' class
        var loaders = document.getElementsByClassName('panel_loader');
        for (var i = 0; i < loaders.length; i++) {
            loaders[i].style.display = 'none';
        }
        console.log("Panels displayed");
    }

    for (var i = 0; i < scripts.length; i++) {
        var script = document.createElement("script");
        script.src = scripts[i];
        script.onload = script_loaded;
        document.head.appendChild(script);
    }

    // Use window.onload to wait for all images to load
    window.onload = function () {
        console.log("All content loaded");
    };
</script>



</body>
</html>
