<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>choccy</title>
    <link rel="icon" href="styles/icon.png">
    <link rel="stylesheet" href="fonts/stylesheet.css">
    <link rel="stylesheet" href="styles/reactive.css">
    <link rel="stylesheet" href="styles/page.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">

<style>
    ::-webkit-scrollbar {
        width: 0px;
    }

    .noselect {
        -webkit-touch-callout: none; /* iOS Safari */
        -webkit-user-select: none; /* Safari */
        -khtml-user-select: none; /* Konqueror HTML */
        -moz-user-select: none; /* Old versions of Firefox */
        -ms-user-select: none; /* Internet Explorer/Edge */
        user-select: none; /* Non-prefixed version, currently supported by Chrome, Edge, Opera and Firefox */

        -webkit-user-drag: none;
        -khtml-user-drag: none;
        -moz-user-drag: none;
        -o-user-drag: none;
    }
</style>
</head>
<body>
        <div id="main_content" class="noselect">
            <div id="main_top">
                    <div class="panel_loader"></div>
                    <div class="panel_loader"></div>
                    <div class="panel_loader"></div>

                    <div id="avatar">
                        <a id="avatar_link" target="_blank" class="noselect">
                            <img id="avatar_image" class="panel noselect norightclick" src="styles/blank.png"></img>
                            <div id="avatar_credit">
                                <p id="avatar_credit_text"></p>
                            </div>
                        </a>
                    </div>

                    <div id="text" class="panel noselect">
                        <div id="text_outer">
                            <div id="text_inner">
                                <h1>choccy</h1>
                                <p>
                                    hobbyist<br>
                                    programmer<br>
                                    music addict<br></p>
                                    <p id="age"></p>
                                    <p id="pronouns"></p>
                                    <p id="flag"></p>
                            </div>   
                        </div> 
                    </div>

                    <div id="player" class="panel">
                        <a id="player_link" target="_blank" class="noselect">
                            <img id="player_image" class="panel noselect norightclick" src="./styles/blank.png"></img>
                        </a>
                       
                        <div id="player_timeline">
                            <div id="player_progress"></div>
                            <p id="player_title" class="noselect"></p>

                        </div>
                    </div>
                                        
            </div>

            <div id="main_bottom">
                <div id="socials">
                    <a><div class="social_button_loader"><div class="icon"></div></div></a>
                    <a><div class="social_button_loader"><div class="icon"></div></div></a>
                    <a><div class="social_button_loader"><div class="icon"></div></div></a>
                    <a><div class="social_button_loader"><div class="icon"></div></div></a>
                    <a><div class="social_button_loader"><div class="icon"></div></div></a>
                    <a><div class="social_button_loader"><div class="icon"></div></div></a>
                </div>
            </div>
</div>
<script> // disable right click on elements
    // Add an event listener for the right-click event on all elements with the specified class
    document.querySelectorAll('.norightclick').forEach(function (element) {
      element.addEventListener('contextmenu', function (event) {
        // Prevent the default right-click behavior
        event.preventDefault();
        // Optionally, you can display a custom message or perform other actions here
        console.log('Right-click is disabled on this element.');
      });
    });
  </script>
<script> // start all scripts and waits for images to load to display all panels and social buttons simultaneously
    // start all scripts from ./scripts
    var scripts = [
        "scripts/bday.js",
        "scripts/userinfo.js",
        "scripts/pronounspage.js",
        "scripts/player.js",
    ];

    var scripts_loaded = 0;
    var scripts_total = scripts.length;

    function script_loaded() {
        scripts_loaded++;
        if (scripts_loaded === scripts_total) {
            console.log("⌚ scripts loaded, waiting for images");
            waitForAsyncOperations();
        }
    }

    function waitForAsyncOperations() {
        // wait for all images to load
        var images = document.getElementsByTagName('img');
        var images_loaded = 0;
        var images_total = images.length;
        for (var i = 0; i < images_total; i++) {
            images[i].onload = function () {
                images_loaded++;
                if (images_loaded === images_total) {
                    console.log("⌚ images fetched");
                    showPanels();
                }
            };
        }
    }

    function showPanels() {
        var panels = document.getElementsByClassName('panel');
        for (var i = 0; i < panels.length; i++) {
            panels[i].style.display = 'block';
        }
        var loaders = document.getElementsByClassName('panel_loader');
        for (var i = 0; i < loaders.length; i++) {
            loaders[i].style.display = 'none';
        }
        var icons = document.querySelectorAll('a > .social_button_loader');
        for (var i = 0; i < icons.length; i++) {
            var icon = icons[i];
            icon.parentNode.parentNode.removeChild(icon.parentNode);
        }
        var icons_show = document.getElementsByClassName('social_button');
        for (var i = 0; i < icons_show.length; i++) {
            icons_show[i].style.display = 'block';
        }
        console.log("✅ loading done, panels displayed");
    }

    for (var i = 0; i < scripts.length; i++) {
        var script = document.createElement("script");
        script.src = scripts[i];
        script.onload = script_loaded;
        document.head.appendChild(script);
    }

</script>



</body>
</html>
