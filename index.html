<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="fonts/stylesheet.css">
    <link rel="stylesheet" href="styles/reactive.css">
    <link rel="stylesheet" href="styles/page.css">

<style>
     ::-webkit-scrollbar {
        display: none !important;

        -moz-user-select: none; /* Old versions of Firefox */
        -ms-user-select: none; /* Internet Explorer/Edge */
        user-select: none; /* Non-prefixed version, currently supported by Chrome, Edge, Opera and Firefox */

        -webkit-user-drag: none;
        -khtml-user-drag: none;
        -moz-user-drag: none;
        -o-user-drag: none;
    }
</style>
</head>
<body>
        <div id="main_content" class="noselect">
            <div id="main_top">
                    <div class="panel_loader"></div>
                    <div class="panel_loader"></div>
                    <div class="panel_loader"></div>

                    <div id="moreabout_transition_top"></div>

                    <div id="avatar" class="panel noselect">
                        <a id="avatar_link" target="_blank" class="noselect">
                            <img id="avatar_image" class="panel noselect norightclick" src="styles/blank.png"></img>
                        </a>
                            
                        <div id="avatar_credit" class="popup">
                            <p id="avatar_credit_text" class="noselect popup_title"></p>
                        </div>
                        
                    </div>

                    <div class="panel noselect">

                                <p>
                                hobbyist<br>

                                music addict<br></p>
                                <p id="age"></p>

                        </div> 
                    </div>

            <div id="main_bottom">
                <div id="moreabout_transition_bottom"></div>

                <a><div class="social_button_loader"><div class="icon"></div></div></a>
                <a><div class="social_button_loader"><div class="icon"></div></div></a>
                <a><div class="social_button_loader"><div class="icon"></div></div></a>
                <a><div class="social_button_loader"><div class="icon"></div></div></a>
                <a><div class="social_button_loader"><div class="icon"></div></div></a>
                <a><div class="social_button_loader"><div class="icon"></div></div></a>
        </div>


</div>

<script> // disable right click on elements
    // Add an event listener for the right-click event on all elements with the specified class
    document.querySelectorAll('.norightclick').forEach(function (element) {
      element.addEventListener('contextmenu', function (event) {
        // Prevent the default right-click behavior
        event.preventDefault();
      });
    });
</script>
<script>
    // start all scripts and waits for images and fonts to load to display all panels and social buttons simultaneously
    var scripts = [
        "scripts/bday.js",
        "scripts/user.js",
        "scripts/player.js",
    ];

    var scripts_loaded = 0;
    var scripts_total = scripts.length;


    function script_loaded() {
        scripts_loaded++;
        if (scripts_loaded === scripts_total) {
            console.log("⌚ scripts loaded");
            waitForAsyncOperations();
        }
    }

    function script_load_error() {
        console.error("⚠️ Error loading scripts");
        setTimeout(showPanels, 150);
    }

    function waitForAsyncOperations() {
        // wait for all images to load
        var images = document.getElementsByTagName('img');
        var images_loaded = 0;
        var images_total = images.length;
        for (var i = 0; i < images_total; i++) {
            images[i].onload = function () {
                images_loaded++;
                if (images_loaded === images_total) {
                    console.log("⌚ images loaded");
                    waitForFonts();
                }
            }
        }
    }

    function waitForFonts() {
        // wait for all fonts to load
        document.fonts.ready.then(function () {
            console.log("⌚ fonts loaded");
            setTimeout(showPanels, 150);
        });
    }

    function showPanels() {
        var panels = document.getElementsByClassName('panel');
        for (var i = 0; i < panels.length; i++) {
            panels[i].style.display = 'block';
        }
        var loaders = document.getElementsByClassName('panel_loader');
        for (var i = loaders.length - 1; i >= 0; i--) {
            // remove all loaders
            loaders[i].parentNode.removeChild(loaders[i]);
        }

        var icons = document.querySelectorAll('a > .social_button_loader');
        for (var i = 0; i < icons.length; i++) {
            var icon = icons[i];
            icon.parentNode.parentNode.removeChild(icon.parentNode);
        }
        var icons_show = document.getElementsByClassName('social_button');
        for (var i = 0; i < icons_show.length; i++) {
            icons_show[i].style.display = 'block';
        }
        console.log("✅ loading done, panels displayed");

        var clickCount = 0;
        var isAnimating = false;
        var animationDuration = 500;

        document.getElementById('moreabout').addEventListener('click', function () {
            if (isAnimating) {
                return; // Ignore click if animation is already in progress
            }

            // add stats.js into html
            var stats = document.createElement("script");
            stats.src = "scripts/stats.js";
            document.head.appendChild(stats);

            var moreaboutTransitionTop = document.getElementById('moreabout_transition_top');
            var moreaboutTransitionBottom = document.getElementById('moreabout_transition_bottom');
            var iconFlip = document.getElementById('more_icon');

            clickCount++;

            if (clickCount % 2 === 1) {
                // Play animations normally
                moreaboutTransitionTop.style.display = 'block';
                moreaboutTransitionBottom.style.display = 'block';
                iconFlip.style.display = 'block';

                setTimeout(function () {
                    iconFlip.style.transform = 'rotate3d(0, 1, 0, 180deg)';

                    // remove all a elements in main_bottom except moreabout
                    var socialButtons = document.querySelectorAll('#main_bottom > a');
                    // ignore moreabout id
                    for (var i = 0; i < socialButtons.length; i++) {
                        socialButtons[i].style.display = 'none';
                        if (socialButtons[i].id === 'moreabout' || socialButtons[i].id === 'lastfminfo1' || socialButtons[i].id === 'lastfminfo2' || socialButtons[i].id === 'lastfminfo3' || socialButtons[i].id === 'lastfminfo4' || socialButtons[i].id === 'lastfminfo5' ) {
                            socialButtons[i].style.display = 'block';
                        }
                    }

                    var mainTop = document.getElementById('main_top');
                    mainTop.style.marginBottom = '5px';
                }, animationDuration / 2);

            } else {
                // Remove transform rotate(180deg) from more_icon
                setTimeout(function () {
                    iconFlip.style.transform = 'none';
                    // remove all a elements in main_bottom except moreabout
                    var socialButtons = document.querySelectorAll('#main_bottom > a');
                    // ignore moreabout id
                    for (var i = 0; i < socialButtons.length; i++) {
                        socialButtons[i].style.display = 'block';
                        if (socialButtons[i].id === 'lastfminfo1' || socialButtons[i].id === 'lastfminfo2' || socialButtons[i].id === 'lastfminfo3' || socialButtons[i].id === 'lastfminfo4' || socialButtons[i].id === 'lastfminfo5' ) {
                            socialButtons[i].style.display = 'none';
                        }
                    }

                    var mainTop = document.getElementById('main_top');
                    mainTop.style.marginBottom = '10px';
                }, animationDuration / 2);
            }

            isAnimating = true;

            setTimeout(function () {
                moreaboutTransitionBottom.style.animation = '';
                moreaboutTransitionTop.style.animation = '';
                isAnimating = false;
            }, animationDuration);

            // when halfway through the animation, show #waka, on next click hide it
            setTimeout(function () {
                if (clickCount % 2 === 1) {
                    // hide all panel classes and show panel_more class
                    var panels = document.getElementsByClassName('panel');
                    var panels_more = document.getElementsByClassName('panel_more');
                    for (var i = 0; i < panels.length; i++) {
                        panels[i].style.display = 'none';
                    }
                    for (var i = 0; i < panels_more.length; i++) {
                        panels_more[i].style.display = 'block';
                    }
                } else {
                    // hide all panel_more classes and show panel class
                    var panels = document.getElementsByClassName('panel');
                    var panels_more = document.getElementsByClassName('panel_more');
                    for (var i = 0; i < panels.length; i++) {
                        panels[i].style.display = 'block';
                    }
                    for (var i = 0; i < panels_more.length; i++) {
                        panels_more[i].style.display = 'none';
                    }
                }
            }, animationDuration / 2);
        });
    }

    for (var i = 0; i < scripts.length; i++) {
        var script = document.createElement("script");
        script.src = scripts[i];
        script.onload = script_loaded;
        script.onerror = script_load_error; // Handle script loading errors
        document.head.appendChild(script);
    }

</script>

<script>
    // custom scrolling for .lastfmHolder
    var lastfmDivs = document.querySelectorAll('.lastfm_holder');

    // create an observer instance for each lastfmDiv
    lastfmDivs.forEach(function(lastfmDiv) {
        var observer = new IntersectionObserver(function(entries) {
            // get all data-ranks inside lastfmDiv
            var ranks = lastfmDiv.querySelectorAll('[data-rank]');

            var maxClicks = Math.ceil(ranks.length / 4) - 1;
            var clickCount = 0;

            lastfmDiv.addEventListener('click', function (event) {
                clickCount++;

                if (clickCount > maxClicks) {
                    clickCount = 0;
                }

                for (var i = 0; i < ranks.length; i++) {
                    if (i >= clickCount * 4 && i < (clickCount + 1) * 4) {
                        ranks[i].style.display = 'block';
                    } else {
                        ranks[i].style.display = 'none';
                    }
                }
            });

            lastfmDiv.addEventListener('touchstart', function (event) {
                clickCount++;

                if (clickCount > maxClicks) {
                    clickCount = 0;
                }

                for (var i = 0; i < ranks.length; i++) {
                    if (i >= clickCount * 4 && i < (clickCount + 1) * 4) {
                        ranks[i].style.display = 'block';
                    } else {
                        ranks[i].style.display = 'none';
                    }
                }
            });

        });

        // observe the lastfmDiv
        observer.observe(lastfmDiv);
    });
</script>

</body>
</html>
