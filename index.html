<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>choccy</title>
    <link rel="icon" href="styles/icon.png">
    <link rel="stylesheet" href="fonts/stylesheet.css">
    <link rel="stylesheet" href="styles/reactive.css">
    <link rel="stylesheet" href="styles/page.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0">    
<style>
     ::-webkit-scrollbar {
        display: none !important;
    }
    

    .noselect {
        -webkit-touch-callout: none; /* iOS Safari */
        -webkit-user-select: none; /* Safari */
        -khtml-user-select: none; /* Konqueror HTML */
        -moz-user-select: none; /* Old versions of Firefox */
        -ms-user-select: none; /* Internet Explorer/Edge */
        user-select: none; /* Non-prefixed version, currently supported by Chrome, Edge, Opera and Firefox */

        -webkit-user-drag: none;
        -khtml-user-drag: none;
        -moz-user-drag: none;
        -o-user-drag: none;
    }
</style>
</head>
<body>
<div id="main_content" class="noselect">
    <div id="main_top">
        <div class="panel_loader skeleton_loader_big"></div>
        <div class="panel_loader skeleton_loader_big"></div>
        <div class="panel_loader skeleton_loader_big"></div>

        <div id="avatar" class="panel noselect">
            <img id="avatar_image" class="panel noselect norightclick" src="styles/blank.png"></img>
                
            <div id="avatar_credit" class="popup">
                <p id="avatar_credit_text" class="noselect popup_title"></p>
            </div>
            
        </div>

        <div id="text" class="panel noselect">
            <div id="text_outer">
                <h1>choccy</h1>
                    <p>
                    hobbyist<br>
                    programmer<br>
                    music addict<br></p>
                    <p id="age"></p>
                    <p id="pronouns"></p>
                    <p id="flag"></p>
            </div> 
        </div>

        <div id="player" class="panel noselect">
            <img id="player_image" class="panel noselect norightclick" src="./styles/blank.png"></img>
            
            <div id="player_timeline" class="popup">
                <p id="player_title" class="noselect popup_title"></p>
            </div>
        </div>

        <div id="lastfm1" class="panel_more skeleton_loader_big_lastfm noselect">
            <div id="lastfm_topalbums_holder" class="lastfm_holder">
                <p class="lastfm_title">top albums</p>
                <div id="lastfm1scrollable" class="lastfm_scrollable"></div>
            </div>
        </div>

        <div id="lastfm2" class="panel_more skeleton_loader_big_lastfm noselect">
            <div id="lastfm_topartist_holder" class="lastfm_holder">
                <p class="lastfm_title">top artist</p>
                <div id="lastfm2scrollable" class="lastfm_scrollable"></div>
            </div>
        </div>

        <div id="lastfm3" class="panel_more skeleton_loader_big_lastfm noselect">
            <div id="lastfm_toptracks_holder" class="lastfm_holder">
                <p class="lastfm_title">top tracks</p>
                <div id="lastfm3scrollable" class="lastfm_scrollable"></div>
            </div>
        </div>                    
    </div>

    <div id="main_bottom">
        <a><div class="social_button_loader skeleton_loader_small"><div class="icon"></div></div></a>
        <a><div class="social_button_loader skeleton_loader_small"><div class="icon"></div></div></a>
        <a><div class="social_button_loader skeleton_loader_small"><div class="icon"></div></div></a>
        <a><div class="social_button_loader skeleton_loader_small"><div class="icon"></div></div></a>
        <a><div class="social_button_loader skeleton_loader_small"><div class="icon"></div></div></a>
        <a><div class="social_button_loader skeleton_loader_small"><div class="icon"></div></div></a>
    </div>
</div>

<script> // disable right click on elements
    // Add an event listener for the right-click event on all elements with the specified class
    document.querySelectorAll('.norightclick').forEach(function (element) {
      element.addEventListener('contextmenu', function (event) {
        // Prevent the default right-click behavior
        event.preventDefault();
      });
    });
</script>
<script>
    // start all scripts and waits for images and fonts to load to display all panels and social buttons simultaneously
    var scripts = [
        "scripts/bday.js",
        "scripts/user.js",
        "scripts/player.js",
    ];

    var scripts_loaded = 0;
    var scripts_total = scripts.length;


    function script_loaded() {
        scripts_loaded++;
        if (scripts_loaded === scripts_total) {
            console.log("⌚ scripts loaded");
            waitForAsyncOperations();
        }
    }

    function script_load_error() {
        console.error("⚠️ Error loading scripts");
        setTimeout(showPanels, 150);
    }

    function waitForAsyncOperations() {
        // wait for all images to load
        var images = document.getElementsByTagName('img');
        var images_loaded = 0;
        var images_total = images.length;
        for (var i = 0; i < images_total; i++) {
            images[i].onload = function () {
                images_loaded++;
                if (images_loaded === images_total) {
                    console.log("⌚ images loaded");
                    waitForFonts();
                }
            }
        }
    }

    function waitForFonts() {
        // wait for all fonts to load
        document.fonts.ready.then(function () {
            console.log("⌚ fonts loaded");
            setTimeout(showPanels, 150);
        });
    }

    function showPanels() {
        var panels = document.getElementsByClassName('panel');
        for (var i = 0; i < panels.length; i++) {
            panels[i].style.display = 'block';
        }
        var loaders = document.getElementsByClassName('panel_loader');
        for (var i = loaders.length - 1; i >= 0; i--) {
            // remove all loaders
            loaders[i].parentNode.removeChild(loaders[i]);
        }

        var icons = document.querySelectorAll('a > .social_button_loader');
        for (var i = 0; i < icons.length; i++) {
            var icon = icons[i];
            icon.parentNode.parentNode.removeChild(icon.parentNode);
        }
        var icons_show = document.getElementsByClassName('social_button');
        for (var i = 0; i < icons_show.length; i++) {
            icons_show[i].style.display = 'block';
        }
        console.log("✅ loading done, panels displayed");

        var clickCount = 0;
        var animationDuration = 500;

        setTimeout(function () {
            document.getElementById('moreabout').addEventListener('click', function () {
            clickCount++;
            var iconFlip = document.getElementById('more_icon');

            if (clickCount % 2 === 1) {
                // Switch to next tab first
                iconFlip.style.display = 'block';

                iconFlip.style.transform = 'rotate3d(0, 1, 0, 180deg)';

                // remove all a elements in main_bottom except moreabout
                var socialButtons = document.querySelectorAll('#main_bottom > a');
                for (var i = 0; i < socialButtons.length; i++) {
                    socialButtons[i].style.display = 'none';
                    if (socialButtons[i].id === 'moreabout' || socialButtons[i].id === 'lastfminfo1' || socialButtons[i].id === 'lastfminfo2' || socialButtons[i].id === 'lastfminfo3' || socialButtons[i].id === 'lastfminfo4' || socialButtons[i].id === 'lastfminfo5') {
                        socialButtons[i].style.display = 'block';
                    }
                }
                // hide avatar, panels and player
                ['avatar', 'player', 'text'].forEach(id => {
                    document.getElementById(id).style.display = 'none';
                });

                // show lastfm panels
                ['lastfm1', 'lastfm2', 'lastfm3'].forEach(id => {
                    document.getElementById(id).style.display = 'block';
                });

                document.getElementById('main_top').style.marginBottom = '5px';

                // Now load stats after tab switch
                if (!window.statsLoaded) {
                    console.log("Loading stats from /stats...");
                    var xhr = new XMLHttpRequest();
                    xhr.open('GET', '/stats', true);
                    xhr.onreadystatechange = function () {
                        if (xhr.readyState === 4) {
                            if (xhr.status === 200) {
                                console.log("Stats data loaded with 200 OK");
                                var statsData = JSON.parse(xhr.responseText);
                                window.statsLoaded = true;
                                console.log("Stats data processed", statsData);
                                
                                // Load stats.js
                                var statsScript = document.createElement("script");
                                statsScript.src = "scripts/stats.js";
                                document.head.appendChild(statsScript);
                                
                                // Remove skeleton loaders from lastfm divs
                                document.getElementById('lastfm1').classList.remove('skeleton_loader_big_lastfm');
                                document.getElementById('lastfm2').classList.remove('skeleton_loader_big_lastfm');
                                document.getElementById('lastfm3').classList.remove('skeleton_loader_big_lastfm');
                            } else {
                                console.log("Waiting for stats to be available (status: " + xhr.status + ")");
                            }
                        }
                    };
                    xhr.send();
                } else {
                    // Stats already loaded, just remove skeleton loaders
                    document.getElementById('lastfm1').classList.remove('skeleton_loader_big_lastfm');
                    document.getElementById('lastfm2').classList.remove('skeleton_loader_big_lastfm');
                    document.getElementById('lastfm3').classList.remove('skeleton_loader_big_lastfm');
                }
            } else {
                // Remove transform rotate(180deg) from more_icon
                iconFlip.style.transform = 'none';
                // remove all a elements in main_bottom except moreabout
                var socialButtons = document.querySelectorAll('#main_bottom > a');
                for (var i = 0; i < socialButtons.length; i++) {
                    socialButtons[i].style.display = 'block';
                    if (socialButtons[i].id === 'lastfminfo1' || socialButtons[i].id === 'lastfminfo2' || socialButtons[i].id === 'lastfminfo3' || socialButtons[i].id === 'lastfminfo4' || socialButtons[i].id === 'lastfminfo5') {
                        socialButtons[i].style.display = 'none';
                    }
                }

                var mainTop = document.getElementById('main_top');
                mainTop.style.marginBottom = '10px';

                // hide avatar, panels and player
                ['avatar', 'player', 'text'].forEach(id => {
                    document.getElementById(id).style.display = 'block';
                });

                // show lastfm panels
                ['lastfm1', 'lastfm2', 'lastfm3'].forEach(id => {
                    document.getElementById(id).style.display = 'none';
                });
            }
            });
        }, 500);
    }


    for (var i = 0; i < scripts.length; i++) {
        var script = document.createElement("script");
        script.src = scripts[i];
        script.onload = script_loaded;
        script.onerror = script_load_error; // Handle script loading errors
        document.head.appendChild(script);
    }

</script>

</body>
</html>
