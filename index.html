<script> // disable right click on elements
    // Add an event listener for the right-click event on all elements with the specified class
    document.querySelectorAll('.norightclick').forEach(function (element) {
      element.addEventListener('contextmenu', function (event) {
        // Prevent the default right-click behavior
        event.preventDefault();
      });
    });
</script>
<script>
    // start all scripts and waits for images and fonts to load to display all panels and social buttons simultaneously
    var scripts = [
        "scripts/bday.js",
        "scripts/user.js",
        "scripts/player.js",
    ];

    var scripts_loaded = 0;
    var scripts_total = scripts.length;


    function script_loaded() {
        scripts_loaded++;
        if (scripts_loaded === scripts_total) {
            console.log("⌚ scripts loaded");
            waitForAsyncOperations();
        }
    }

    function script_load_error() {
        console.error("⚠️ Error loading scripts");
        setTimeout(showPanels, 150);
    }

    function waitForAsyncOperations() {
        // wait for all images to load
        var images = document.getElementsByTagName('img');
        var images_loaded = 0;
        var images_total = images.length;
        for (var i = 0; i < images_total; i++) {
            images[i].onload = function () {
                images_loaded++;
                if (images_loaded === images_total) {
                    console.log("⌚ images loaded");
                    waitForFonts();
                }
            }
        }
    }

    function waitForFonts() {
        // wait for all fonts to load
        document.fonts.ready.then(function () {
            console.log("⌚ fonts loaded");
            setTimeout(showPanels, 150);
        });
    }

    function showPanels() {
        var panels = document.getElementsByClassName('panel');
        for (var i = 0; i < panels.length; i++) {
            panels[i].style.display = 'block';
        }
        var loaders = document.getElementsByClassName('panel_loader');
        for (var i = loaders.length - 1; i >= 0; i--) {
            // remove all loaders
            loaders[i].parentNode.removeChild(loaders[i]);
        }

        var icons = document.querySelectorAll('a > .social_button_loader');
        for (var i = 0; i < icons.length; i++) {
            var icon = icons[i];
            icon.parentNode.parentNode.removeChild(icon.parentNode);
        }
        var icons_show = document.getElementsByClassName('social_button');
        for (var i = 0; i < icons_show.length; i++) {
            icons_show[i].style.display = 'block';
        }
        console.log("✅ loading done, panels displayed");

        var clickCount = 0;
        var isAnimating = false;
        var animationDuration = 1000;

        document.getElementById('moreabout').addEventListener('click', function () {
            if (isAnimating) {
                return; // Ignore click if animation is already in progress
            }

            // add stats.js into html
            var stats = document.createElement("script");
            stats.src = "scripts/stats.js";
            document.head.appendChild(stats);

            var moreaboutTransitionTop = document.getElementById('moreabout_transition_top');
            var moreaboutTransitionBottom = document.getElementById('moreabout_transition_bottom');
            var iconFlip = document.getElementById('more_icon');

            clickCount++;

            if (clickCount % 2 === 1) {
                // Play animations normally
                moreaboutTransitionTop.style.display = 'block';
                moreaboutTransitionBottom.style.display = 'block';
                iconFlip.style.display = 'block';

                if (window.innerWidth < 926) {
                    moreaboutTransitionBottom.style.animation = 'moreabout_transition_anim_mobile ' + animationDuration + 'ms forwards';
                    moreaboutTransitionTop.style.animation = 'moreabout_transition_anim_mobile ' + animationDuration + 'ms forwards';
                } else {
                    moreaboutTransitionBottom.style.animation = 'moreabout_transition_anim_desktop ' + animationDuration + 'ms forwards';
                    moreaboutTransitionTop.style.animation = 'moreabout_transition_anim_desktop ' + animationDuration + 'ms forwards';
                }

                // Add transform rotate(180deg) to more_icon
                setTimeout(function () {
                    iconFlip.style.transform = 'rotate3d(0, 1, 0, 180deg)';
                }, animationDuration / 2);
            } else {
                // Play animations in reverse
                if (window.innerWidth < 926) {
                    moreaboutTransitionBottom.style.animation = 'moreabout_transition_anim_mobile ' + animationDuration + 'ms reverse';
                    moreaboutTransitionTop.style.animation = 'moreabout_transition_anim_mobile ' + animationDuration + 'ms reverse';
                } else {
                    moreaboutTransitionBottom.style.animation = 'moreabout_transition_anim_desktop ' + animationDuration + 'ms reverse';
                    moreaboutTransitionTop.style.animation = 'moreabout_transition_anim_desktop ' + animationDuration + 'ms reverse';
                }

                // Remove transform rotate(180deg) from more_icon
                setTimeout(function () {
                    iconFlip.style.transform = 'none';
                }, animationDuration / 2);
            }

            isAnimating = true;

            setTimeout(function () {
                moreaboutTransitionBottom.style.animation = '';
                moreaboutTransitionTop.style.animation = '';
                isAnimating = false;
            }, animationDuration);

            // when halfway through the animation, show #waka, on next click hide it
            setTimeout(function () {
                if (clickCount % 2 === 1) {
                    // hide all panel classes and show panel_more class
                    var panels = document.getElementsByClassName('panel');
                    var panels_more = document.getElementsByClassName('panel_more');
                    for (var i = 0; i < panels.length; i++) {
                        panels[i].style.display = 'none';
                    }
                    for (var i = 0; i < panels_more.length; i++) {
                        panels_more[i].style.display = 'block';
                    }
                } else {
                    // hide all panel_more classes and show panel class
                    var panels = document.getElementsByClassName('panel');
                    var panels_more = document.getElementsByClassName('panel_more');
                    for (var i = 0; i < panels.length; i++) {
                        panels[i].style.display = 'block';
                    }
                    for (var i = 0; i < panels_more.length; i++) {
                        panels_more[i].style.display = 'none';
                    }
                }
            }, animationDuration / 2);
        });
    }

    for (var i = 0; i < scripts.length; i++) {
        var script = document.createElement("script");
        script.src = scripts[i];
        script.onload = script_loaded;
        script.onerror = script_load_error; // Handle script loading errors
        document.head.appendChild(script);
    }

</script>

<script>
    // custom scrolling for #lastfm
    var lastfmDiv = document.getElementById('lastfm');
    const scrollAmount = 280;
    var scrollCount = 0;
    var maxScroll = 3;

    // disable default scrolling behavior
    lastfmDiv.addEventListener('wheel', function (e) {
        e.preventDefault();

        // scroll up or down by scrollAmount pixels when the mouse wheel is used
        if (e.deltaY > 0 && scrollCount < maxScroll) {
            lastfmDiv.scrollBy(0, scrollAmount);
            scrollCount++;
        } else if (e.deltaY < 0 && scrollCount > -maxScroll) {
            lastfmDiv.scrollBy(0, -scrollAmount);
            scrollCount--;
        }

        //console.log("Scrolls left: " + (maxScroll - Math.abs(scrollCount)));

        // reset scrollCount if at the top or bottom of the element
        if (lastfmDiv.scrollTop === 0 || lastfmDiv.scrollTop === (lastfmDiv.scrollHeight - lastfmDiv.clientHeight)) {
            scrollCount = 0;
        }
    });

    // move the element all the way up when the page starts
    window.onbeforeunload = function () {
        lastfmDiv.scrollTop = 0;
    }

    // stop scrolling when reaching the limit
    lastfmDiv.addEventListener('scroll', function () {
        if (lastfmDiv.scrollTop < 0 || lastfmDiv.scrollTop > (lastfmDiv.scrollHeight - lastfmDiv.clientHeight)) {
            lastfmDiv.scrollTop = Math.max(0, Math.min(lastfmDiv.scrollTop, lastfmDiv.scrollHeight - lastfmDiv.clientHeight));
        }
    });
</script>

</body>
</html>
